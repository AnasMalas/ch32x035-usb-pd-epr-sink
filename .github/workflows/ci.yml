name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Run maintained repository checks
        shell: pwsh
        run: ./scripts/check.ps1 -HostTarget x86_64-unknown-linux-gnu -RequireNode
