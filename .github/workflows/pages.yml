name: Deploy USB-PD control page

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/package-gui.ps1"
      - "tools/pd-control/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package single-file control page
        shell: pwsh
        run: |
          ./scripts/package-gui.ps1 -Output artifacts/pages/index.html
          Copy-Item tools/pd-control/robots.txt artifacts/pages/robots.txt

      - name: Upload control page
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
