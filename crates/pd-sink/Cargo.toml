[package]
name = "ch32x035-usb-pd-epr-sink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "USB Power Delivery sink policy and CH32X035 integration with PPS and EPR AVS support"
keywords = ["ch32x035", "usb-pd", "epr", "pps", "embedded"]
categories = ["embedded", "no-std", "hardware-support"]
publish = false

[lib]
name = "pd_sink"
path = "src/lib.rs"

[features]
default = ["hard-reset-reasons"]
ch32x035 = ["dep:ch32-hal", "dep:embassy-futures", "dep:usbpd-traits"]
hard-reset-reasons = ["usbpd/hard-reset-reasons"]

[dependencies]
ch32-hal = { path = "../../vendor/ch32-hal", default-features = false, features = ["ch32x035f8u6", "embassy"], optional = true }
embassy-futures = { version = "0.1.2", optional = true }
usbpd = { path = "../../vendor/usbpd" }
usbpd-traits = { path = "../../vendor/usbpd-traits", optional = true }

[dev-dependencies]
heapless = "0.9.2"
