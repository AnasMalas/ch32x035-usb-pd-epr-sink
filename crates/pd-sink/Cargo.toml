[package]
name = "ch32x035-usb-pd-epr-sink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "USB Power Delivery sink policy and CH32X035 integration with PPS and EPR AVS support"
readme = "README.md"
keywords = ["ch32x035", "usb-pd", "epr", "pps", "embedded"]
categories = ["embedded", "no-std", "hardware-support"]
publish = false

[lib]
name = "pd_sink"
path = "src/lib.rs"

[features]
default = ["hard-reset-reasons", "rich-telemetry"]
ch32x035c8t6 = ["dep:ch32-hal", "dep:embassy-futures", "dep:usbpd-traits", "ch32-hal/ch32x035c8t6"]
ch32x035f7p6 = ["dep:ch32-hal", "dep:embassy-futures", "dep:usbpd-traits", "ch32-hal/ch32x035f7p6"]
ch32x035f8u6 = ["dep:ch32-hal", "dep:embassy-futures", "dep:usbpd-traits", "ch32-hal/ch32x035f8u6"]
ch32x035g8r6 = ["dep:ch32-hal", "dep:embassy-futures", "dep:usbpd-traits", "ch32-hal/ch32x035g8r6"]
ch32x035g8u6 = ["dep:ch32-hal", "dep:embassy-futures", "dep:usbpd-traits", "ch32-hal/ch32x035g8u6"]
ch32x035r8t6 = ["dep:ch32-hal", "dep:embassy-futures", "dep:usbpd-traits", "ch32-hal/ch32x035r8t6"]
hard-reset-reasons = ["usbpd/hard-reset-reasons"]
initial-capabilities-fallback = ["usbpd/initial-capabilities-fallback"]
numeric-trace = ["usbpd/numeric-trace"]
driver-boundary-trace = ["ch32-hal?/usbpd-driver-trace"]
rich-telemetry = []

[dependencies]
ch32-hal = { path = "../../vendor/ch32-hal", default-features = false, features = ["embassy"], optional = true }
embassy-futures = { version = "0.1.2", optional = true }
usbpd = { path = "../../vendor/usbpd", default-features = false }
usbpd-traits = { path = "../../vendor/usbpd-traits", optional = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
heapless = "0.9.2"
