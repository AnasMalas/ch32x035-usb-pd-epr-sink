[package]
name = "usbpd"
version = "2.0.0"
authors = ["Adrian Figueroa <elagil@takanome.de>"]
edition = "2024"
publish = false
description = "USB-PD library for `[no_std]`."
documentation = "https://docs.rs/usbpd"
repository = "https://github.com/elagil/usbpd"
homepage = "https://github.com/elagil/usbpd"
readme = "README.md"
license = "MIT"
keywords = ["no_std", "usb-pd", "embedded"]

[dependencies]
usbpd-traits = { version = "2.0.0", path = "../usbpd-traits" }
proc-bitfield = "0.5.3"
byteorder = { version = "1.5.0", default-features = false }
heapless = "0.9.2"
embassy-futures = "0.1.1"
critical-section = { version = "1.2.0", optional = true }

thiserror = { version = "2.0.18", default-features = false }
defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.29", optional = true }
serde = { version = "1.0.228", default-features = false, features = [
    "derive",
], optional = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
tokio = { version = "1.49.0", features = ["rt", "macros"] }

[features]
default = ["source"]

hard-reset-reasons = []
numeric-trace = ["dep:critical-section"]
# The public API historically included both power roles. Sink-only products
# can disable default features to omit the source policy and source-only codec
# paths without making this additive Cargo feature hostile to feature unification.
source = []
log = ["dep:log"]
defmt = ["dep:defmt", "heapless/defmt"]
serde = ["dep:serde", "heapless/serde"]

# Keep this maintained descendant independently formattable and testable when
# consumed as a path dependency from another workspace.
[workspace]
